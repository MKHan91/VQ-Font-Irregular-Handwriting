overwrite: False
work_dir: ./results/baseline2/
batch_size: 20
comb_iter: 800000
seed: 2
g_lr: 2e-4
d_lr: 6e-4
n_workers: 0
adam_betas: [0.0, 0.9]
init: kaiming

# content_font: "NanumBarunpenR"
language: "kor"

# data_path: /home/dev/VQ-Font/datasets/handwrite_dataset/lmdb
# data_meta: /home/dev/VQ-Font/datasets/handwrite_dataset/meta/train.json

dset_aug:
  normalize: True
  
cv_n_unis: 30
cv_n_fonts: 10

# model
C: 32
input_size: 128
g_args:
  comp_enc:
    norm: "in"
    activ: relu
  dec:
    norm: "in"
    activ: relu
    out: sigmoid
  content_enc:
    C_out: 256
    content_sigmoid: False
    
d_args:
  w_norm: spectral
  activ: relu
  gap_activ: relu
  res_scale_var: False

# losses
pixel_loss_type: l1
pixel_w: 1

gan_w:  1.0 # -> 0.5 고려
style_w: 5.0
fm_w: 1.0

# etc
save: all-last
# print_freq: 5000
# tb_freq: 5000
# val_freq: 5000
# save_freq: 50000
